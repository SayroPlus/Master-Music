name: music_organizer
description: "Music Organizer - Smart local music library manager with AI-powered organization"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Database
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Audio
  just_audio: ^0.9.43
  audio_service: ^0.18.17

  # Permissions
  permission_handler: ^12.0.1

  # Networking
  http: ^1.3.0
  dio: ^5.8.0+1

  # Utilities
  crypto: ^3.0.6
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  file_picker: ^9.2.2

  # UI Components
  flutter_slidable: ^3.1.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  palette_generator: ^0.3.3+7
  collection: ^1.19.1
  uuid: ^4.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
